lain that the UI handler is installed before connect. Keep content text fallback and CSP metadata. Source: https://apps.extensions.modelcontextprotocol.io/api/documents/migrate-to-v2.html","Open docs/exercises/03-views.md. Add the comparison Table using the existing shadcn components. Call from the host with view list, then compare. UI buttons are completed in exercise 4. The screenshot shows the actual list rendering. Break follows this block.","Open docs/exercises/04-interaction.md. The snippet shows the data path; the implementation also checks isError and supplies a timeout. A UI-initiated result returns to the caller; do not wait for a new ontoolresult event. Review pending, error and stale-result handling in app.tsx. Source: MCP Apps SDK app.callServerTool documentation.","Click Help me choose in the prepared host and inspect Messages. The message contains the visible session IDs and applied filters. Check host capabilities, handle rejection and preserve the main browsing interaction if follow-up is unsupported. Source: https://modelcontextprotocol.io/extensions/apps/overview","Demonstrate an empty 17:00–18:00 window, then a reversed window and recovery. Do not replace working data with a blank screen while loading. Untrusted strings render as text. The sandbox and typed contract have different jobs. A read-only example avoids real booking side effects.","Open docs/exercises/05-challenge.md. Prefer the room-filter option if short on time. Ask pairs to show the changed tool argument and output, not just the screen. The timeline is a stretch option; think about simultaneous sessions.","Reserve the final fifteen minutes for Q&A and recovery. Ask attendees to name the model, host, tool, resource and React responsibilities. Share the final checkpoint and invite follow-up in #react-alicante-2026. Conference: https://reactalicante.es . Reusable description: docs/workshop.md."];
